<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采招网采集管理</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><h1>采招网采集管理</h1><p>每日北京时间 08:00 · 全国 · 近一周 · 招标公告 / 招标预告 · 每任务最多 15 页</p>
<p id="connection" role="status">正在连接本地服务…</p>
<p id="message" role="status"></p>
<section><div class="section-heading"><h2>采招网登录</h2><span id="authState" class="badge">正在检查</span></div><p id="auth">正在读取登录状态…</p>
<div class="actions"><button id="passwordStart" class="primary">打开账号登录</button><button id="smsStart">短信登录</button><button id="challenge">打开验证页面</button></div>
<p class="hint">在弹出的浏览器里正常登录即可，系统会自动识别并继续采集。只有网站要求时才需要人工验证，无需再手动保存会话。窗口在运行服务的电脑上打开。</p>
<details><summary>登录未被识别？查看辅助操作</summary><button id="complete">重新检查登录</button><div class="actions" id="managedControls"><button id="sendSms">发送短信验证码</button><label>短信验证码 <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button id="verifySms">提交验证码</button><button id="passwordSubmit">提交账号登录</button></div></details></section>
<section><div class="section-heading"><h2>采集任务</h2><span id="queueSummary" class="hint"></span></div><p id="queueHint" class="queue-hint" role="status">正在读取任务状态…</p><p id="search"></p><p id="pacing" class="hint"></p><div class="query-controls"><label>查询词（选填，每行一个查询）<textarea id="queries" rows="2" placeholder="留空使用默认查询；所有查询合计最多 15 页"></textarea></label><button id="run" class="primary">立即采集</button></div><div id="runs" aria-label="采集任务列表">—</div></section>
<section><h2>已保存项目</h2><div class="actions"><input id="keyword" placeholder="在已保存数据中搜索"><label><input id="valid" type="checkbox">只看可跟进项目</label><button id="loadProjects">查询</button><button id="previous">上一页</button><span id="pagination"></span><button id="next">下一页</button></div>
<div class="table-wrap"><table><thead><tr><th>项目</th><th>地区</th><th>发布</th><th>预算（元）</th><th>报名/文件截止</th><th>投标/响应截止</th><th>信息完整性</th></tr></thead><tbody id="projects"></tbody></table></div>
<dialog id="detail"><button id="closeDetail">关闭</button><pre id="detailText"></pre></dialog></section>
<section><h2>提醒</h2><ul id="notifications"></ul></section>
</main></body></html>
